<div id="ald_settings">
  <div class="inline-drawer">
    <div class="inline-drawer-toggle inline-drawer-header">
      <b>Auto Light/Dark</b>
      <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
    </div>
    <div class="inline-drawer-content">
      <label for="ald_mode">Mode</label>
      <select id="ald_mode" class="text_pole">
        <option value="auto">Automatique (suit le système)</option>
        <option value="light">Toujours clair</option>
        <option value="dark">Toujours sombre</option>
      </select>
      <small class="opacity50">En automatique, le thème change tout seul quand votre iPhone passe en mode clair ou sombre.</small>
    </div>
  </div>
</div>
